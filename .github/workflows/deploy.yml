name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT CODE
      # ==========================================
      - name: Checkout Code
        uses: actions/checkout@v4

      # ==========================================
      # SET UP NODE.JS
      # ==========================================
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ==========================================
      # CREATE FRONTEND ENV
      # MUST HAPPEN BEFORE BUILD
      # ==========================================
      - name: Create .env file
        run: |
          cat > .env <<'EOF'
          VITE_BACKEND_URL=http://api.invoices.ffsdgroup.com
          EOF

          echo "Frontend environment created."

      # ==========================================
      # INSTALL DEPENDENCIES
      # ==========================================
      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # ==========================================
      # BUILD APPLICATION
      # ==========================================
      - name: Build Application
        run: |
          npm run build

          echo "===== BUILD CONTENTS ====="
          ls -lah dist/

          if [ ! -f dist/index.html ]; then
            echo "ERROR: dist/index.html was not generated."
            exit 1
          fi

          echo "Build completed successfully."

      # ==========================================
      # SETUP SSH
      # ==========================================
      - name: Setup SSH Key
        shell: bash
        run: |
          set -e

          echo "===== SETTING UP SSH ====="

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Preserve multiline private key
          cat > ~/.ssh/deploy_key <<'EOF'
          ${{ secrets.SERVER_SSH_KEY }}
          EOF

          chmod 600 ~/.ssh/deploy_key

          echo "===== VALIDATING SSH PRIVATE KEY ====="

          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /tmp/deploy_public_key 2>/tmp/ssh_key_error; then
            echo "ERROR: SSH private key is invalid."
            echo "ssh-keygen output:"
            cat /tmp/ssh_key_error
            exit 1
          fi

          echo "SSH private key is valid."

          echo "===== ADDING SERVER TO KNOWN HOSTS ====="

          ssh-keyscan -H "${{ secrets.SERVER_IP }}" >> ~/.ssh/known_hosts 2>/dev/null

          chmod 644 ~/.ssh/known_hosts

          echo "===== TESTING SSH AUTHENTICATION ====="

          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            maypevcf@${{ secrets.SERVER_IP }} \
            "whoami"

          echo "===== SSH AUTHENTICATION SUCCESSFUL ====="

      # ==========================================
      # BACKUP CURRENT RELEASE
      # ==========================================
      - name: Backup Current Release
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            maypevcf@${{ secrets.SERVER_IP }} "
              set -e

              echo '===== BACKUP CURRENT RELEASE ====='

              if [ -d /home/invoices.ffsdgroup.com/public_html ]; then

                rm -rf /home/invoices.ffsdgroup.com/public_html_backup

                cp -a \
                  /home/invoices.ffsdgroup.com/public_html \
                  /home/invoices.ffsdgroup.com/public_html_backup

                echo 'Backup created successfully.'

              else

                echo 'No existing release found. Backup skipped.'

              fi
            "

      # ==========================================
      # DEPLOY FILES
      # ==========================================
      - name: Deploy Files
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_IP }}
          REMOTE_USER: maypevcf
          TARGET: "/home/invoices.ffsdgroup.com/public_html/"
          SOURCE: "dist/"
          ARGS: "-rlgoDzvc --delete"
          SCRIPT_BEFORE: |
            echo "===== PREPARING DEPLOYMENT ====="
            mkdir -p /home/invoices.ffsdgroup.com/public_html
          SCRIPT_AFTER: |
            echo "===== FILE DEPLOYMENT COMPLETED ====="

      # ==========================================
      # VERIFY DEPLOYMENT
      # ==========================================
      - name: Verify Deployment
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            maypevcf@${{ secrets.SERVER_IP }} "
              set -e

              echo '===== VERIFY DEPLOYMENT ====='

              DEPLOY_PATH='/home/invoices.ffsdgroup.com/public_html'

              if [ ! -f \"\$DEPLOY_PATH/index.html\" ]; then
                echo 'ERROR: index.html not found.'
                exit 1
              fi

              echo 'index.html found.'

              echo '===== DEPLOYED FILES ====='
              ls -lah \"\$DEPLOY_PATH\"

              echo '===== DEPLOYMENT VERIFIED SUCCESSFULLY ====='
            "

      # ==========================================
      # FIX PERMISSIONS
      # SAFE VERSION - NO CHOWN
      # ==========================================
      - name: Fix Permissions After Deploy
        if: success()
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            maypevcf@${{ secrets.SERVER_IP }} "
              set -e

              echo '===== FIXING PERMISSIONS ====='

              find /home/invoices.ffsdgroup.com/public_html \
                -type d \
                -exec chmod 755 {} \;

              find /home/invoices.ffsdgroup.com/public_html \
                -type f \
                -exec chmod 644 {} \;

              echo 'Permissions fixed successfully.'
            "

      # ==========================================
      # ROLLBACK IF DEPLOYMENT FAILED
      # ==========================================
      - name: Rollback if Failed
        if: failure()
        continue-on-error: true
        run: |
          echo "===== ROLLBACK INITIATED ====="

          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            maypevcf@${{ secrets.SERVER_IP }} "
              echo '===== SERVER ROLLBACK ====='

              BACKUP='/home/invoices.ffsdgroup.com/public_html_backup'
              CURRENT='/home/invoices.ffsdgroup.com/public_html'

              if [ -d \"\$BACKUP\" ]; then

                rm -rf \"\$CURRENT\"

                mv \
                  \"\$BACKUP\" \
                  \"\$CURRENT\"

                echo 'Rollback completed successfully.'

              else

                echo 'No backup found. Rollback skipped.'

              fi
            "

      # ==========================================
      # DEPLOYMENT SUMMARY
      # ==========================================
      - name: Deployment Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "======================================"
            echo "DEPLOYMENT SUCCESSFUL"
            echo "======================================"
            echo "Frontend: invoices.ffsdgroup.com"
            echo "Backend:  api.invoices.ffsdgroup.com"
          else
            echo "======================================"
            echo "DEPLOYMENT FAILED"
            echo "Rollback was attempted if possible."
            echo "======================================"
            exit 1
          fi
